name: Daily Auto Commit

on:
  schedule:
    # Runs once daily at 10:05 UTC (3:35 PM IST)
    - cron: '5 10 * * *'
  workflow_dispatch:  # allows manual runs

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # ✅ this allows pushing to the repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update log file (22f3002614@ds.study.iitm.ac.in)
        run: |
          echo "Last run: $(date -u)" > daily_log.txt

      - name: Commit and push changes
        run: |
          git config user.name "DevSync Bot"
          git config user.email "22f3002614@ds.study.iitm.ac.in"
          git add daily_log.txt
          git commit -m "Automated daily update: $(date -u)" || echo "No changes to commit"
          git push
